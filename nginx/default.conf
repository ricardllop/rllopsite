server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # TLS ends at the gateway, so nginx only ever sees plain HTTP. Any redirect it
    # builds itself must stay relative, or it would send visitors to http://
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    # Requests arrive through the gateway proxy: compress those too
    gzip_proxied any;
    gzip_types text/css text/plain application/javascript application/json
               application/xml application/rss+xml application/atom+xml image/svg+xml;

    error_page 404 /404.html;

    # Webpack output, content-hashed file names: cache forever
    location ~ ^/(es/)?assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Images keep their name when they change: cache for a day
    location ~ ^/(es/)?img/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Spanish pages get the Spanish 404
    location /es/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        error_page 404 /es/404.html;
        try_files $uri $uri/index.html =404;
    }

    # Docusaurus writes each page as <path>/index.html but links to <path>. Serving the
    # index file directly avoids the redirect nginx would otherwise do to add the slash.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }
}
