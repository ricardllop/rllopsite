name: Docker Image CI

on:
  push:
    branches: [ "main" ]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate Timestamp Tag
        run: |
          TIMESTAMP=$(date +"%Y.%m.%d-%H%M")
          echo "tag=ga-$TIMESTAMP" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/arm64
          push: true
          tags: rllopdev/rllopsite:${{ env.tag }}
          build-args: |
            DOCKER_IMAGE_TAG=${{ env.tag }}

      - name: Checkout helm chart repository
        uses: actions/checkout@v7
        with:
          repository: ricardllop/oke-helm-charts
          sparse-checkout: |
            rllopsite-chart
          path: oke-helm-charts
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: true

      - name: Modify image tag value on helm chart
        uses: mikefarah/yq@v4.54.1
        with:
          cmd: yq -i '.image.tag="${{ env.tag }}"' 'oke-helm-charts/rllopsite-chart/values.yaml'

      - name: Configure Git
        working-directory: ./oke-helm-charts
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

      - name: Commit and Push Changes
        working-directory: ./oke-helm-charts
        run: |
          git add rllopsite-chart/values.yaml
          git commit -m "bump: Update image tag: ${{ env.tag }} via GitHub Action"
          git push origin main